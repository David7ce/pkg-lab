# Recetario para escritorio. Solo lo mínimo, cada formato en el sistema que lo genera:
#   Windows x64  → .msi
#   Linux x64    → AppImage (un fichero, funciona en cualquier distro)
#   macOS arm64  → .dmg (runner arm)
# Pendientes a propósito: Linux arm64, iOS (requiere cuenta de Apple Developer para instalar en un iPhone).
name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "android/Recetario/**"
      - "android/shared/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            glob: "*.msi"
          - os: ubuntu-latest
            task: packageAppImage
            glob: "*.AppImage"
          - os: macos-14
            task: packageDmg
            glob: "*.dmg"
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }})
    defaults:
      run:
        shell: bash
        working-directory: android/Recetario
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests de escritorio
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest --no-daemon

      - name: Instalador (${{ matrix.task }})
        run: ./gradlew :shared:${{ matrix.task }} --no-daemon

      # El plugin deja cada formato en su propia subcarpeta; se busca y se copia a una carpeta fija.
      - name: Localizar instalador
        run: |
          mkdir -p "$RUNNER_TEMP/installers"
          found=$(find shared/build/compose -type f -name '${{ matrix.glob }}' | head -1)
          echo "::notice title=Instalador::${found:-no encontrado}"
          [ -n "$found" ] || { echo "::error::No se generó ${{ matrix.glob }}"; find shared/build/compose -maxdepth 4 | head -50; exit 1; }
          cp "$found" "$RUNNER_TEMP/installers/"

      - name: Guardar instalador
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/installers/${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          files=$(find dist -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.dmg' \))
          echo "::notice title=Instaladores::$(echo $files | tr '\n' ' ')"
          [ -n "$files" ] || { echo "::error::No hay instaladores que publicar"; exit 1; }
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Compilado automáticamente desde ${GITHUB_SHA::7}.

          - **.msi**: Windows (64 bits).
          - **.AppImage**: Linux (64 bits). Hazlo ejecutable y ábrelo, no necesita instalación.
          - **.dmg**: macOS (Apple Silicon).
          NOTES
          gh release delete desktop-recetario-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          if ! out=$(gh release create desktop-recetario-latest $files \
                --target "$GITHUB_SHA" \
                --title "Recetario (escritorio)" \
                --notes-file "$RUNNER_TEMP/notes.md" 2>&1); then
            echo "::error title=Publicar en Releases::$out"
            exit 1
          fi
          echo "$out"
