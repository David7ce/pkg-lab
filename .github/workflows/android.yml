# Compila las apps de android/<App>/ en GitHub (no hace falta PC).
# - Push a main: compila solo las apps cuya carpeta ha cambiado.
# - Manual (Actions -> Android -> Run workflow): una app concreta o todas.
# Cada app se compila EN PARALELO para arm64-v8a, armeabi-v7a y universal,
# y se publica en su release "android-<App>-latest" con las tres APKs.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Carpeta de la app dentro de android/ (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ github.event.inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          all() { for d in android/*/; do [ -f "$d/gradlew" ] && basename "$d"; done; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_APP" ]; then apps="$INPUT_APP"; else apps=$(all); fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            apps=$(all)   # primer push o historial reescrito
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
            if echo "$changed" | grep -q '^.github/workflows/android.yml$'; then
              apps=$(all)
            else
              apps=$(echo "$changed" | grep '^android/' | cut -d/ -f2 | sort -u)
            fi
          fi

          # Solo carpetas que existen y son proyectos Gradle
          json=$(for a in $apps; do [ -f "android/$a/gradlew" ] && echo "$a"; done | jq -R . | jq -sc .)
          echo "Apps a compilar: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
        abi: [arm64-v8a, armeabi-v7a, universal]
    name: build (${{ matrix.app }}, ${{ matrix.abi }})
    defaults:
      run:
        working-directory: android/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # El keystore va cifrado (AES-256) en .github/signing/; solo la contraseña es secret.
      # La misma clave firma todas las apps, así cada versión nueva se instala encima.
      - name: Preparar keystore
        working-directory: .
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f .github/signing/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in .github/signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
              -pass env:KEYSTORE_PASSWORD
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secret ANDROID_KEYSTORE_PASSWORD: se firma con clave debug (para actualizar habrá que desinstalar)."
          fi

      - name: Compilar APK (${{ matrix.abi }})
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: pkglab
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pabi=${{ matrix.abi }} --no-daemon
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "${{ matrix.app }}-${{ matrix.abi }}.apk"
          ls -lh "${{ matrix.app }}-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app }}-${{ matrix.abi }}
          path: android/${{ matrix.app }}/${{ matrix.app }}-${{ matrix.abi }}.apk

  release:
    needs: [detect, build]
    if: ${{ !cancelled() && needs.detect.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ matrix.app }}-*
          merge-multiple: true
          path: apks

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}
          TAG: android-${{ matrix.app }}-latest
        run: |
          ls -lh apks
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" apks/*.apk \
            --target "$GITHUB_SHA" \
            --title "$APP (Android) · build ${GITHUB_RUN_NUMBER}" \
            --notes "Compilada automáticamente desde ${GITHUB_SHA::7}.

          - **$APP-arm64-v8a.apk**: la mayoría de móviles (64 bits).
          - **$APP-armeabi-v7a.apk**: móviles antiguos de 32 bits.
          - **$APP-universal.apk**: funciona en cualquiera."
