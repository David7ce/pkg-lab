# Builds the apps under android/<App>/ on GitHub (no PC needed).
# - Push to main: builds only the apps whose folder changed.
# - Manual (Actions -> Android -> Run workflow): one specific app, or all of them.
# Each app builds IN PARALLEL for arm64-v8a, armeabi-v7a and universal,
# and publishes to its "android-<App>-latest" release with all three APKs.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Carpeta de la app dentro de android/ (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_APP: ${{ github.event.inputs.app }}
          BEFORE: ${{ github.event.before }}
        run: |
          all() { for d in android/*/; do [ -f "$d/gradlew" ] && basename "$d"; done; return 0; }  # folders without gradlew (shared) don't count

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_APP" ]; then apps="$INPUT_APP"; else apps=$(all); fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            apps=$(all)   # first push, or rewritten history
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
            if echo "$changed" | grep -qE '^(\.github/workflows/android\.yml|android/shared/)'; then
              apps=$(all)
            else
              apps=$(echo "$changed" | grep '^android/' | cut -d/ -f2 | sort -u)
            fi
          fi

          # Only folders that exist and are Gradle projects
          json=$(for a in $apps; do [ -f "android/$a/gradlew" ] && echo "$a"; done | jq -R . | jq -sc .)
          echo "Apps a compilar: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
        abi: [arm64-v8a, armeabi-v7a, universal]
    name: build (${{ matrix.app }}, ${{ matrix.abi }})
    defaults:
      run:
        working-directory: android/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # The keystore is encrypted (AES-256) in .github/signing/; only the password is a secret.
      # The same key signs every app, so each new version installs over the previous one.
      - name: Prepare keystore
        working-directory: .
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f .github/signing/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in .github/signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" \
              -pass env:KEYSTORE_PASSWORD
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Missing secret ANDROID_KEYSTORE_PASSWORD: signing with the debug key (updating over it will need an uninstall)."
          fi

      - name: Build APK (${{ matrix.abi }})
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: pkglab
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -Pabi=${{ matrix.abi }} --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # Version read from the built APK itself, so any app's own versionName is used.
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          version=$("$aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          name="${{ matrix.app }}-android-${version:-unknown}-${{ matrix.abi }}.apk"
          cp "$apk" "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name"

      # Unit tests once per app (not per ABI). Apps without tests pass with nothing to run.
      - name: Unit tests
        if: matrix.abi == 'universal'
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          # Summary visible on the run page: proves the tests ran, not just that nothing failed.
          sum() { find . -path '*/build/test-results/*' -name 'TEST-*.xml' -exec grep -ho "<testsuite [^>]*" {} + \
                    | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          echo "::notice title=Unit tests::$(sum tests) tests, $(sum failures) failures, $(sum errors) errors, $(sum skipped) skipped"

      # On failure, compiler errors, Gradle's summary and failed tests become annotations,
      # visible on the run page (and through the API) without opening the full log.
      - name: Errors as annotations
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          esc() { awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/\r/,"%0D"); if (NR>1) print "%0A"; print}'; }
          grep -E '^e: ' "$log" | sort -u | head -8 | while IFS= read -r line; do
            loc=$(echo "$line" | sed -nE "s#^e: file://$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+) .*#file=\1,line=\2,col=\3#p")
            msg=$(echo "$line" | sed -E 's#^e: file://[^ ]+ ##; s#^e: ##')
            echo "::error ${loc}::$(printf '%s' "$msg" | esc)"
          done
          {
            grep -A12 '^\* What went wrong:' "$log" | head -30
            grep -E ' FAILED$' "$log" | head -10
            find . -path '*/build/test-results/*' -name '*.xml' -exec grep -h -A2 '<failure' {} + 2>/dev/null | head -30
          } > "$RUNNER_TEMP/summary.txt"
          [ -s "$RUNNER_TEMP/summary.txt" ] && echo "::error title=Gradle::$(esc < "$RUNNER_TEMP/summary.txt")"
          true

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.app }}-${{ matrix.abi }}
          path: android/${{ matrix.app }}/${{ env.APK_NAME }}

  release:
    needs: [detect, build]
    if: ${{ !cancelled() && needs.detect.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so the commit log below can reach an old release's commit

      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ matrix.app }}-*
          merge-multiple: true
          path: apks

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}
          TAG: android-${{ matrix.app }}-latest
        run: |
          ls -lh apks
          # <App>-android-<version>-<abi>.apk → <version>
          version=$(ls apks/*.apk | head -1 | sed -E "s#.*/${APP}-android-(.*)-(arm64-v8a|armeabi-v7a|universal)\.apk#\1#")

          # Commits since the last release of this app (none on a first-ever release for it).
          prev=$(gh release view "$TAG" --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          log=""
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            log=$(git log "$prev..$GITHUB_SHA" --oneline --no-decorate -- "android/$APP" "android/shared" 2>/dev/null)
          fi

          gh release delete "$TAG" --yes --cleanup-tag || true
          {
            echo "Built automatically from ${GITHUB_SHA::7}."
            echo
            echo "- **…-arm64-v8a.apk**: most phones (64-bit)."
            echo "- **…-armeabi-v7a.apk**: older 32-bit phones."
            echo "- **…-universal.apk**: works on any of them."
            if [ -n "$log" ]; then
              echo
              echo "Changes:"
              echo "$log" | sed 's/^/- /'
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" apks/*.apk \
            --target "$GITHUB_SHA" \
            --title "$APP ${version} (Android)" \
            --notes-file "$RUNNER_TEMP/notes.md"
